[package]
name = "ultradian"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Gated schedules and workflows for invoking AI"
license = "MIT"
repository = "https://github.com/aaronvanston/ultradian"
publish = false
# legacy/ is the 0.2.x TypeScript build and tests/ holds fixtures; neither
# belongs in a source package.
exclude = ["legacy/", "docs/", ".github/"]

[[bin]]
name = "ultradian"
path = "src/main.rs"

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
# preserve_order: the embedded catalog is reprinted with its keys in the
# order 0.2.1 wrote them, which isn't alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
