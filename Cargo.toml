[package]
name = "ultradian"
version = "0.3.0"
edition = "2024"
rust-version = "1.97"
description = "Gated schedules and workflows for invoking AI"
license = "MIT"
repository = "https://github.com/aaronvanston/ultradian"
publish = false
# Docs and CI don't belong in a source package.
exclude = ["docs/", ".github/"]

[[bin]]
name = "ultradian"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Embedded zone data, so hosts without /usr/share/zoneinfo still resolve
# --tz names.
chrono-tz = { version = "0.10", default-features = false, features = ["case-insensitive"] }
getrandom = "0.3"
libc = "0.2"
# bundled: SQLite links statically, so the binary needs no system library.
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: the embedded catalog is reprinted with its keys in the
# order 0.2.1 wrote them, which isn't alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
# build.rs strips release binaries at link time instead; see link_args there.
strip = false
