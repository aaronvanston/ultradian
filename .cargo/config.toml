[env]
# Compile options for the bundled SQLite, applied after libsqlite3-sys's
# own. Each import is a symbol dyld looks up on every launch, and the store
# needs none of these: SQLite's private malloc zone (plain malloc serves
# it) and loading extensions.
LIBSQLITE3_FLAGS = "-DSQLITE_WITHOUT_ZONEMALLOC -USQLITE_ENABLE_LOAD_EXTENSION -DSQLITE_OMIT_LOAD_EXTENSION"
