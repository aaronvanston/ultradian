name: Release

# A tag such as v0.2.0 that matches package.json's version publishes that
# version: the four archives and SHA256SUMS from scripts/build-release.ts.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Tag matches the package version
        run: |
          version="$(bun -e 'console.log(require("./package.json").version)')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version" >&2
            exit 1
          fi
      - run: bun run ci
      - run: bun run build:release
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/release/
          if-no-files-found: error

  check-linux:
    name: Check the Linux builds start
    needs: build
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - run: |
          cd release
          archive="$(ls ultradian-*-${{ matrix.target }}.tar.gz)"
          grep " $archive\$" SHA256SUMS | sha256sum -c -
          tar -xzf "$archive"
          ./ultradian version --json

  publish:
    name: Publish
    needs: [build, check-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "Builds for macOS and Linux on arm64 and x64. Check an archive against SHA256SUMS, extract it, and run './ultradian self install'."
