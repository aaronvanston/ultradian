name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Gates run under /bin/sh: dash on Ubuntu, bash's sh on macOS, so the
      # daemon test in tests/cli.rs covers both shells.
      - run: cargo test
      # launchd calls on macOS, systemd calls on Linux.
      - run: cargo build && BIN=target/debug/ultradian tests/service/calls.sh
